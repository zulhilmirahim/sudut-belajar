<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Matematik Darjah 2 (Versi Penuh)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: satu skrin app, gaya buku latihan (sama dengan hub) — kad topik, kemudian satu soalan sebesar skrin */
:root{
  --paper:#FFFDF5;
  --line:#D9E6F5;
  --margin:#F2A3A3;
  --ink:#1D3557;
  --muted:#5B6B82;
  --sun:#FFC93C;
  --tomato:#E63946;
  --grass:#2A9D8F;
  --sky:#457B9D;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 0 30px,var(--margin) 30px 32px,transparent 32px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px);
  color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.app{max-width:560px;margin:0 auto;padding:24px 16px 40px 46px;display:flex;flex-direction:column;gap:20px}
.screen{display:none;flex-direction:column;gap:20px}
.screen.on{display:flex}

/* topbar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:15px;background:var(--ink);color:var(--paper);padding:3px 12px;border-radius:999px}
.demo{font-size:12px;font-weight:800;color:var(--tomato);border:2px dashed var(--tomato);padding:2px 10px;border-radius:999px}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 58%,var(--sun) 58%);padding:0 4px}
.lead{margin:0;color:var(--muted)}

/* topic cards */
.topics{display:grid;gap:12px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.topic:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.topic:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ic{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:#fff}
.t-txt{flex:1;min-width:0}
.t-txt strong{display:block;font-weight:800;font-size:18px}
.t-txt span{display:block;font-size:14px;color:var(--muted)}
.stars{flex:none;font-size:18px;letter-spacing:1px;color:#D5DCE6}
.stars .s-on{color:var(--sun);-webkit-text-stroke:1px #C99A12}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.back{background:none;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:800}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);width:0;transition:width .25s}
.count{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.qcard{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:240px;justify-content:center}
.qlabel{font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.qbig{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,10vw,52px);line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}

/* bentuk lazim */
.lazim{display:grid;grid-template-columns:auto auto;column-gap:14px;font-family:var(--font-display);font-weight:800;font-size:clamp(36px,10vw,50px);line-height:1.1;font-variant-numeric:tabular-nums}
.lazim .op{grid-column:1;align-self:end}
.lazim .n{grid-column:2;text-align:right;letter-spacing:.08em}
.lazim .rule{grid-column:1 / span 2;border-top:4px solid var(--ink);margin-top:6px}
.lazim .ans{grid-column:2;text-align:right;color:var(--tomato)}

/* duit */
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid #9C7A1E;background:radial-gradient(circle at 35% 30%,#FFE9A8,#E3B341);color:#5A430A}
.coin.silver{border-color:#7D8794;background:radial-gradient(circle at 35% 30%,#F4F6F8,#B9C1CB);color:#3A4350}
.note{min-width:92px;height:52px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:17px;border:3px solid;padding:0 10px}
.note.rm1{background:#DCEBFB;border-color:#3D6FB0;color:#1F4778}
.note.rm5{background:#DDF3E3;border-color:#2F8A4E;color:#1C5A31}
.note.rm10{background:#FBDDDD;border-color:#B23A3A;color:#7A1F1F}

/* pecahan & bentuk */
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-variant-numeric:tabular-nums}
.frac b{display:block;padding:0 6px}
.frac b:first-child{border-bottom:3px solid currentColor;padding-bottom:3px}
.frac b:last-child{padding-top:3px}
.story{font-size:clamp(19px,5vw,22px);font-weight:700;text-align:center;line-height:1.5;max-width:30ch;text-wrap:balance}
.emoji{font-size:72px;line-height:1}
.opts.words .opt{font-family:var(--font-body);font-size:clamp(17px,4.6vw,21px)}
.sec{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--muted);margin:6px 0 -4px;letter-spacing:.04em}
.full{font-size:12px;font-weight:800;color:#145C53;background:#DDF3EF;padding:3px 10px;border-radius:999px}
.music-btn{position:fixed;right:16px;bottom:16px;z-index:10;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.music-btn.on{background:var(--grass);color:#fff}
.app{padding-bottom:84px}
.foot{font-size:13px;color:var(--muted);text-align:center}
/* jam */
.clock{width:190px;height:190px}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px 8px;font-family:var(--font-display);font-weight:800;font-size:clamp(22px,6vw,28px);box-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;transition:transform .1s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px)}
.opt:disabled{cursor:default}
.opt.right{background:#DDF3EF;border-color:var(--grass);box-shadow:3px 3px 0 var(--grass);color:#145C53}
.opt.wrong{background:#FDE2E4;border-color:var(--tomato);box-shadow:3px 3px 0 var(--tomato);color:#8E1B24}
.feedback{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb-msg{font-weight:800;font-size:18px}
.fb-msg.ok{color:var(--grass)}
.fb-msg.no{color:var(--tomato)}
.next{background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:12px 22px;font-weight:800;font-size:17px;visibility:hidden}
.next.show{visibility:visible}

/* result */
.result{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.r-stars{font-size:52px;letter-spacing:6px;color:#D5DCE6;line-height:1}
.r-stars .s-on{color:var(--sun);-webkit-text-stroke:2px #C99A12}
.r-score{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.r-msg{margin:0;color:var(--muted);max-width:32ch}
.r-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{border:2px solid var(--ink);border-radius:12px;padding:12px 20px;font-weight:800;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.upsell{border:2px dashed var(--ink);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--muted);text-align:center}
.upsell strong{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <section class="screen on" id="home" aria-labelledby="h-home">
    <div class="top"><span class="brand">Sudut Belajar</span><span class="full">VERSI PENUH</span></div>
    <h1 id="h-home">Matematik <span class="hl">Darjah 2</span></h1>
    <p class="lead">12 topik silibus setahun dan satu ujian campuran. Setiap pusingan ada 30 soalan baharu. Dapat 27 atau lebih betul, dapat 3 bintang!</p>
    <div class="topics" id="topics"></div>
    <p class="foot">Untuk kegunaan pembeli sahaja. Terima kasih kerana tidak berkongsi link ini.</p>
  </section>

  <section class="screen" id="quiz" aria-live="polite">
    <div class="qhead">
      <button class="back" id="backBtn" type="button">← Topik</button>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <span class="count" id="count">1/30</span>
    </div>
    <div class="qcard">
      <div class="qlabel" id="qLabel"></div>
      <div id="qBody"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback">
      <span class="fb-msg" id="fbMsg"></span>
      <button class="next" id="nextBtn" type="button">Seterusnya →</button>
    </div>
  </section>

  <section class="screen" id="result">
    <div class="top"><span class="brand">Sudut Belajar</span><span class="full">VERSI PENUH</span></div>
    <div class="result">
      <div class="r-stars" id="rStars"></div>
      <div class="r-score" id="rScore"></div>
      <p class="r-msg" id="rMsg"></p>
      <div class="r-btns">
        <button class="btn primary" id="againBtn" type="button">Main lagi</button>
        <button class="btn" id="homeBtn" type="button">Pilih topik lain</button>
      </div>
    </div>
  </section>

</div>
<button class="music-btn" id="musicBtn" type="button" aria-pressed="false"><span aria-hidden="true">🎵</span><span id="musicLbl">Muzik tenang</span></button>

<script>
(function(){
  var TOTAL = 30;
  var rnd = function(a,b){return Math.floor(Math.random()*(b-a+1))+a;};
  var pick = function(arr){return arr[rnd(0,arr.length-1)];};
  var shuffle = function(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;};
  var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});};
  var rm = function(sen){return "RM" + (sen/100).toFixed(2);};
  var NAMES = ["Ali","Siti","Aiman","Mei Ling","Ravi","Nurul","Hafiz","Aina","Kumar","Farah"];

  // ---------- pembantu jawapan ----------
  function numOpts(ans, unit, deltas){
    unit = unit || "";
    var set=[ans], ds=shuffle((deltas||[1,-1,10,-10,100,-100,2,-2,5,-5]).slice());
    for(var i=0;i<ds.length && set.length<4;i++){var v=ans+ds[i]; if(v>=0 && set.indexOf(v)<0) set.push(v);}
    return {opts:shuffle(set).map(function(v){return {label:v+unit, ok:v===ans};}), ans:ans+unit};
  }
  function textOpts(right, wrongs){
    var set=[right];
    shuffle(wrongs.slice()).forEach(function(w){ if(set.length<4 && set.indexOf(w)<0) set.push(w); });
    return {opts:shuffle(set).map(function(v){return {label:v, ok:v===right};}), ans:right, words:true};
  }
  function Q(label, body, o){ return {label:label, body:body, opts:o.opts, ans:o.ans, words:!!o.words, html:!!o.html}; }
  var big = function(t){return '<div class="qbig">'+t+'</div>';};
  var story = function(t){return '<div class="story">'+t+'</div>';};

  // ---------- nombor dalam perkataan ----------
  var ONES=["kosong","satu","dua","tiga","empat","lima","enam","tujuh","lapan","sembilan"];
  function words(n){
    if(n===1000) return "seribu";
    var out=[], h=Math.floor(n/100), r=n%100;
    if(h) out.push(h===1?"seratus":ONES[h]+" ratus");
    if(r){
      if(r<10) out.push(ONES[r]);
      else if(r===10) out.push("sepuluh");
      else if(r===11) out.push("sebelas");
      else if(r<20) out.push(ONES[r-10]+" belas");
      else { out.push(ONES[Math.floor(r/10)]+" puluh"); if(r%10) out.push(ONES[r%10]); }
    }
    return out.join(" ") || "kosong";
  }

  function lazim(a,b,op){
    return '<div class="lazim"><span class="n">'+a+'</span><span class="op">'+op+'</span><span class="n">'+b+'</span><span class="rule"></span><span class="ans">?</span></div>';
  }

  // ---------- grafik ----------
  function fracSVG(k,n){
    var shapes="", col="#FFC93C", line="#1D3557";
    if(Math.random()<0.5){
      var w=240/n;
      for(var i=0;i<n;i++) shapes+='<rect x="'+(10+i*w)+'" y="40" width="'+w+'" height="90" fill="'+(i<k?col:"#fff")+'" stroke="'+line+'" stroke-width="3"/>';
      return '<svg viewBox="0 0 260 170" width="240" role="img" aria-label="Rajah pecahan">'+shapes+'</svg>';
    }
    for(var j=0;j<n;j++){
      var a0=j/n*2*Math.PI-Math.PI/2, a1=(j+1)/n*2*Math.PI-Math.PI/2, r=80;
      var x0=100+r*Math.cos(a0), y0=100+r*Math.sin(a0), x1=100+r*Math.cos(a1), y1=100+r*Math.sin(a1);
      shapes+='<path d="M100 100 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+(1/n>0.5?1:0)+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+(j<k?col:"#fff")+'" stroke="'+line+'" stroke-width="3"/>';
    }
    return '<svg viewBox="0 0 200 200" width="190" role="img" aria-label="Rajah pecahan">'+shapes+'</svg>';
  }
  var fracHTML=function(k,n){return '<span class="frac"><b>'+k+'</b><b>'+n+'</b></span>';};

  var MONEY = [
    {sen:10,  html:'<span class="coin silver">10 sen</span>'},
    {sen:20,  html:'<span class="coin silver">20 sen</span>'},
    {sen:50,  html:'<span class="coin">50 sen</span>'},
    {sen:100, html:'<span class="note rm1">RM1</span>'},
    {sen:500, html:'<span class="note rm5">RM5</span>'},
    {sen:1000,html:'<span class="note rm10">RM10</span>'}
  ];

  function clockSVG(h,m){
    var t="";
    for(var i=1;i<=12;i++){var a=(i/12)*2*Math.PI; t+='<text x="'+(100+Math.sin(a)*72).toFixed(1)+'" y="'+(100-Math.cos(a)*72+7).toFixed(1)+'" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="20" fill="#1D3557">'+i+'</text>';}
    for(var k=0;k<60;k++){var b=(k/60)*2*Math.PI, r1=k%5===0?88:91; t+='<line x1="'+(100+Math.sin(b)*r1).toFixed(1)+'" y1="'+(100-Math.cos(b)*r1).toFixed(1)+'" x2="'+(100+Math.sin(b)*94).toFixed(1)+'" y2="'+(100-Math.cos(b)*94).toFixed(1)+'" stroke="#1D3557" stroke-width="'+(k%5===0?3:1)+'"/>';}
    var ma=(m/60)*2*Math.PI, ha=((h%12)/12+m/720)*2*Math.PI;
    return '<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Jam analog"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#1D3557" stroke-width="5"/>'+t+
      '<line x1="100" y1="100" x2="'+(100+Math.sin(ha)*46).toFixed(1)+'" y2="'+(100-Math.cos(ha)*46).toFixed(1)+'" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>'+
      '<line x1="100" y1="100" x2="'+(100+Math.sin(ma)*72).toFixed(1)+'" y2="'+(100-Math.cos(ma)*72).toFixed(1)+'" stroke="#1D3557" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#1D3557"/></svg>';
  }
  var tfmt=function(h,m){return h+":"+(m<10?"0":"")+m;};

  function shapeSVG(kind){
    var st='fill="#FFC93C" stroke="#1D3557" stroke-width="4"', b='';
    if(kind==="sq") b='<rect x="50" y="30" width="120" height="120" '+st+'/>';
    if(kind==="rect") b='<rect x="20" y="50" width="180" height="90" '+st+'/>';
    if(kind==="tri") b='<polygon points="110,25 195,155 25,155" '+st+'/>';
    if(kind==="circ") b='<circle cx="110" cy="90" r="70" '+st+'/>';
    return '<svg viewBox="0 0 220 180" width="200" role="img" aria-label="Bentuk dua dimensi">'+b+'</svg>';
  }

  var DAYS=["Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu","Ahad"];
  var MONTHS=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];

  // ---------- topik ----------
  var TOPICS = [
    {id:"nombor", sec:"Nombor dan Operasi", name:"Nombor hingga 1000", desc:"Nilai tempat, perkataan, bundar", ic:"123", color:"var(--tomato)",
     gen:function(){
       var t=rnd(1,5), n=rnd(101,999);
       if(t===1){ var ds=String(n).split(""), p=rnd(0,2), d=+ds[p]; if(d===0){p=0;d=+ds[0];} var val=d*[100,10,1][p];
         return Q("Apakah nilai digit yang bergaris?", big(ds.map(function(c,i){return i===p?'<u style="text-decoration-color:#E63946;text-decoration-thickness:5px">'+c+'</u>':c;}).join("")), numOpts(val,"",[val*9, -val+d, val*10, d-val].map(function(x){return x;}).concat([1,10]))); }
       if(t===2){ var w=words(n), sw=Math.floor(n/100)*100+(n%10)*10+Math.floor(n/10)%10, wr=[n+10,n-10,n+1,n-1,n+100,n-100,sw].filter(function(x){return x>=100&&x<=999&&x!==n;}).map(words);
         return Q("Pilih nombor dalam perkataan.", big(n), textOpts(w, wr.filter(function(x){return x!==w;}))); }
       if(t===3){ return Q("Tulis nombor ini dalam angka.", story(words(n)), numOpts(n)); }
       if(t===4){ var r=Math.round(n/10)*10; if(n%10===5) r=n+5; return Q("Bundarkan kepada puluh yang terdekat.", big(n), numOpts(r,"",[-10,10,-20,20])); }
       var a=rnd(100,989), op=Math.random()<0.5, ans=op?a+1:a-1;
       return Q(op?"Apakah nombor selepas ini?":"Apakah nombor sebelum ini?", big(a), numOpts(ans,"",[2,-2,10,-10]));
     }},
    {id:"tambah", sec:"Nombor dan Operasi", name:"Tambah", desc:"Bentuk lazim dan ayat cerita", ic:"+", color:"var(--tomato)",
     gen:function(){
       var a=rnd(100,599), b=rnd(11,399);
       if(Math.random()<0.6) return Q("Berapakah jawapannya?", lazim(a,b,"+"), numOpts(a+b));
       var nm=pick(NAMES), x=rnd(20,450), y=rnd(15,450);
       return Q("Ayat cerita", story(nm+" ada "+x+" biji guli. Ayah memberinya "+y+" biji lagi. Berapakah jumlah guli "+nm+" sekarang?"), numOpts(x+y));
     }},
    {id:"tolak", sec:"Nombor dan Operasi", name:"Tolak", desc:"Bentuk lazim dan ayat cerita", ic:"−", color:"var(--sky)",
     gen:function(){
       var a=rnd(200,999), b=rnd(11,a-50);
       if(Math.random()<0.6) return Q("Berapakah jawapannya?", lazim(a,b,"−"), numOpts(a-b));
       var x=rnd(150,900), y=rnd(20,x-30);
       return Q("Ayat cerita", story("Sebuah kedai ada "+x+" buah buku. Sebanyak "+y+" buah buku telah dijual. Berapakah baki buku di kedai itu?"), numOpts(x-y));
     }},
    {id:"darab", sec:"Nombor dan Operasi", name:"Darab", desc:"Sifir 2, 3, 4, 5 dan 10", ic:"×", color:"var(--grass)",
     gen:function(){
       var t=pick([2,3,4,5,10]), n=rnd(1,10);
       if(Math.random()<0.65) return Q("Sifir "+t, big(t+" × "+n+" = ?"), numOpts(t*n,"",[t,-t,1,-1,10]));
       var items=pick([["bakul","biji epal"],["kotak","batang pensel"],["pinggan","keping kuih"],["pasu","kuntum bunga"]]);
       return Q("Ayat cerita", story("Ada "+n+" "+items[0]+". Setiap "+items[0]+" ada "+t+" "+items[1]+". Berapakah jumlah "+items[1]+" semuanya?"), numOpts(t*n,"",[t,-t,1,-1,n]));
     }},
    {id:"bahagi", sec:"Nombor dan Operasi", name:"Bahagi", desc:"Bahagi dalam sifir 2, 3, 4, 5, 10", ic:"÷", color:"var(--grass)",
     gen:function(){
       var t=pick([2,3,4,5,10]), n=rnd(1,10), tot=t*n;
       if(Math.random()<0.6) return Q("Berapakah jawapannya?", big(tot+" ÷ "+t+" = ?"), numOpts(n,"",[1,-1,2,-2,t]));
       return Q("Ayat cerita", story(tot+" biji gula-gula dibahagikan sama banyak kepada "+t+" orang murid. Berapakah biji gula-gula yang setiap murid dapat?"), numOpts(n,"",[1,-1,2,-2,t]));
     }},
    {id:"pecahan", sec:"Nombor dan Operasi", name:"Pecahan", desc:"Kenal pecahan dari rajah", ic:"½", color:"#E07A1F",
     gen:function(){
       var n=pick([2,3,4,5,6,8,10]), k=rnd(1,n-1), right=k+"/"+n, set=[right];
       [(n-k)+"/"+n, k+"/"+(n+1), (k+1>n-1?k-1:k+1)+"/"+n, n+"/"+k].forEach(function(c){var p=c.split("/"); if(set.length<4 && set.indexOf(c)<0 && +p[0]>0 && +p[0]<+p[1]) set.push(c);});
       while(set.length<4){var c2=rnd(1,9)+"/"+(rnd(2,10)); var q=c2.split("/"); if(+q[0]<+q[1] && set.indexOf(c2)<0) set.push(c2);}
       return {label:"Berapakah pecahan bahagian yang berwarna?", body:fracSVG(k,n), html:true,
         opts:shuffle(set).map(function(v){var p=v.split("/"); return {label:fracHTML(p[0],p[1]), ok:v===right};}), ans:right.replace("/"," per ")};
     }},
    {id:"wang", sec:"Sukatan dan Geometri", name:"Wang", desc:"Kira duit dan baki hingga RM100", ic:"RM", color:"#C99A12",
     gen:function(){
       if(Math.random()<0.5){
         var n=rnd(2,4), items=[], sum=0;
         for(var i=0;i<n;i++){var it=pick(MONEY); items.push(it); sum+=it.sen;}
         items.sort(function(x,y){return y.sen-x.sen;});
         var o=numOpts(sum,"",[10,-10,50,-50,100,-100,20,-20]);
         return Q("Berapakah jumlah duit ini?", '<div class="money">'+items.map(function(x){return x.html;}).join("")+'</div>', {opts:o.opts.map(function(p){var v=parseInt(p.label,10); return {label:rm(v), ok:p.ok};}), ans:rm(sum)});
       }
       var nm=pick(NAMES), have=pick([1000,2000,5000]), cost=rnd(3,Math.floor(have/50)-2)*50;
       var o2=numOpts(have-cost,"",[50,-50,100,-100,500,-500]);
       return Q("Ayat cerita", story(nm+" ada "+rm(have)+". Dia membeli sebuah buku berharga "+rm(cost)+". Berapakah baki wang "+nm+"?"), {opts:o2.opts.map(function(p){return {label:rm(parseInt(p.label,10)), ok:p.ok};}), ans:rm(have-cost)});
     }},
    {id:"masa", sec:"Sukatan dan Geometri", name:"Masa dan Waktu", desc:"Jam, hari dan bulan", ic:"⏰", color:"#7B5EA7",
     gen:function(){
       var t=rnd(1,4);
       if(t<=2){ var h=rnd(1,12), m=rnd(0,11)*5, right=tfmt(h,m), set=[right];
         shuffle([tfmt(h===12?1:h+1,m), tfmt(h,(m+5)%60), tfmt((m/5)||12,(h%12)*5), tfmt(h===1?12:h-1,m)]).forEach(function(c){if(set.length<4&&set.indexOf(c)<0) set.push(c);});
         return {label:"Pukul berapakah sekarang?", body:clockSVG(h,m), opts:shuffle(set).map(function(v){return {label:v, ok:v===right};}), ans:right}; }
       if(t===3){ var d=rnd(0,6), after=Math.random()<0.5, ans=DAYS[(d+(after?1:6))%7];
         return Q(after?"Hari apakah selepas hari ini?":"Hari apakah sebelum hari ini?", big(DAYS[d]), textOpts(ans, DAYS.filter(function(x){return x!==ans && x!==DAYS[d];}))); }
       var mo=rnd(0,11), ans2=MONTHS[(mo+1)%12];
       return Q("Bulan apakah selepas bulan ini?", big(MONTHS[mo]), textOpts(ans2, MONTHS.filter(function(x){return x!==ans2 && x!==MONTHS[mo];})));
     }},
    {id:"panjang", sec:"Sukatan dan Geometri", name:"Panjang", desc:"Sentimeter dan meter", ic:"📏", color:"var(--sky)",
     gen:function(){
       var t=rnd(1,3);
       if(t===1){ var m=rnd(1,9); return Q("Tukar unit.", big(m+" m = ? cm"), numOpts(m*100," cm",[10,-10,-90*m,900*m,50])); }
       if(t===2){ var a=rnd(10,60), b=rnd(10,60); return Q("Ayat cerita", story("Sebatang pensel panjangnya "+a+" cm. Sebatang pembaris panjangnya "+b+" cm. Berapakah jumlah panjang kedua-duanya?"), numOpts(a+b," cm",[1,-1,10,-10])); }
       var x=rnd(40,99), y=rnd(10,x-5); return Q("Ayat cerita", story("Reben merah panjangnya "+x+" cm. Reben biru panjangnya "+y+" cm. Berapakah beza panjang dua reben itu?"), numOpts(x-y," cm",[1,-1,10,-10]));
     }},
    {id:"jisim", sec:"Sukatan dan Geometri", name:"Jisim", desc:"Gram dan kilogram", ic:"⚖", color:"var(--grass)",
     gen:function(){
       var t=rnd(1,3);
       if(t===1){ var k=rnd(1,9); return Q("Tukar unit.", big(k+" kg = ? g"), numOpts(k*1000," g",[100,-100,-900*k,500])); }
       if(t===2){ var a=rnd(100,500), b=rnd(100,450); return Q("Ayat cerita", story("Sebungkus gula berjisim "+a+" g. Sebungkus tepung berjisim "+b+" g. Berapakah jumlah jisim kedua-duanya?"), numOpts(a+b," g",[10,-10,100,-100])); }
       var p=rnd(1,3), q=rnd(1,3); while(q===p) q=rnd(1,3);
       var items=[["tembikai",p*1000],["epal",rnd(100,300)],["beg sekolah",q*1000+500]], hv=items.slice().sort(function(x,y){return y[1]-x[1];})[0][0];
       return Q("Yang manakah paling berat?", story(items.map(function(i){return i[0]+": "+(i[1]>=1000?(i[1]/1000)+" kg":i[1]+" g");}).join("<br>")), textOpts(hv, items.map(function(i){return i[0];}).filter(function(x){return x!==hv;}).concat(["sama berat"])));
     }},
    {id:"isipadu", sec:"Sukatan dan Geometri", name:"Isi Padu Cecair", desc:"Mililiter dan liter", ic:"🥛", color:"var(--sky)",
     gen:function(){
       if(Math.random()<0.5){ var l=rnd(1,9); return Q("Tukar unit.", big(l+" l = ? ml"), numOpts(l*1000," ml",[100,-100,-900*l,500])); }
       var a=rnd(100,600), b=rnd(50,a-20);
       if(Math.random()<0.5) return Q("Ayat cerita", story("Ibu membeli "+a+" ml susu dan "+b+" ml jus. Berapakah jumlah isi padu minuman itu?"), numOpts(a+b," ml",[10,-10,100,-100]));
       return Q("Ayat cerita", story("Sebuah botol berisi "+a+" ml air. Adik minum "+b+" ml. Berapakah baki air dalam botol itu?"), numOpts(a-b," ml",[10,-10,100,-100]));
     }},
    {id:"bentuk", sec:"Sukatan dan Geometri", name:"Ruang dan Bentuk", desc:"Bentuk 2D dan 3D", ic:"▲", color:"#E07A1F",
     gen:function(){
       if(Math.random()<0.5){
         var k=pick([["sq","segi empat sama",4],["rect","segi empat tepat",4],["tri","segi tiga",3],["circ","bulatan",0]]);
         if(k[0]!=="circ" && Math.random()<0.5) return Q("Berapakah bilangan sisi bentuk ini?", shapeSVG(k[0]), numOpts(k[2],"",[1,-1,2,-2]));
         return Q("Apakah nama bentuk ini?", shapeSVG(k[0]), textOpts(k[1], ["segi empat sama","segi empat tepat","segi tiga","bulatan","pentagon"].filter(function(x){return x!==k[1];})));
       }
       var d=pick([["🎲","kubus"],["⚽","sfera"],["🥫","silinder"],["📦","kuboid"],["🍦","kon"]]);
       return Q("Objek ini berbentuk apa?", '<div class="emoji" aria-hidden="true">'+d[0]+'</div>', textOpts(d[1], ["kubus","sfera","silinder","kuboid","kon","piramid"].filter(function(x){return x!==d[1];})));
     }}
  ];
  TOPICS.push({id:"campuran", sec:"Ulang kaji", name:"Ujian Campuran", desc:"Soalan dari semua topik", ic:"★", color:"var(--ink)",
    gen:function(){ return pick(TOPICS.slice(0,12)).gen(); }});

  var best={};
  try{ best=JSON.parse(localStorage.getItem("sb-d2-mt-full")||"{}")||{}; }catch(e){ best={}; }
  function saveBest(){ try{ localStorage.setItem("sb-d2-mt-full", JSON.stringify(best)); }catch(e){} }
  function starsHTML(n){ var s=""; for(var i=0;i<3;i++) s+='<span class="'+(i<n?"s-on":"")+'">★</span>'; return s; }
  function starsFor(sc){ return sc>=27?3:sc>=21?2:sc>=15?1:0; }

  var ac=null;
  function beep(ok){
    try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(), g=ac.createGain();
      o.type="triangle"; o.connect(g); g.connect(ac.destination); var t=ac.currentTime;
      o.frequency.setValueAtTime(ok?660:220,t); if(ok) o.frequency.setValueAtTime(880,t+0.09);
      g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); o.start(t); o.stop(t+0.32);
    }catch(e){}
  }

  var $=function(id){return document.getElementById(id);};
  function show(id){ ["home","quiz","result"].forEach(function(s){ $(s).classList.toggle("on", s===id); }); window.scrollTo(0,0); }

  function renderHome(){
    var html="", last="";
    TOPICS.forEach(function(t,i){
      if(t.sec!==last){ html+='<div class="sec">'+esc(t.sec.toUpperCase())+'</div>'; last=t.sec; }
      html+='<button class="topic" type="button" data-i="'+i+'"><span class="ic" style="background:'+t.color+'">'+esc(t.ic)+'</span>'+
        '<span class="t-txt"><strong>'+esc(t.name)+'</strong><span>'+esc(t.desc)+'</span></span>'+
        '<span class="stars" aria-label="'+(best[t.id]||0)+' bintang">'+starsHTML(best[t.id]||0)+'</span></button>';
    });
    $("topics").innerHTML=html;
  }

  var cur=null, qn=0, score=0, q=null;
  function start(i){ cur=TOPICS[i]; qn=0; score=0; show("quiz"); nextQ(); }
  function nextQ(){
    if(qn>=TOTAL){ finish(); return; }
    q=cur.gen(); qn++;
    $("count").textContent=qn+"/"+TOTAL;
    $("barFill").style.width=((qn-1)/TOTAL*100)+"%";
    $("qLabel").textContent=q.label;
    $("qBody").innerHTML=q.body;
    $("fbMsg").textContent=""; $("fbMsg").className="fb-msg";
    $("nextBtn").classList.remove("show");
    $("opts").className="opts"+(q.words?" words":"");
    $("opts").innerHTML=q.opts.map(function(o,i){ return '<button class="opt" type="button" data-i="'+i+'">'+(q.html?o.label:esc(o.label))+'</button>'; }).join("");
  }
  function answer(i){
    var btns=$("opts").querySelectorAll(".opt"), o=q.opts[i];
    btns.forEach(function(b,j){ b.disabled=true; if(q.opts[j].ok) b.classList.add("right"); });
    if(o.ok){ score++; $("fbMsg").textContent=pick(["Betul! Hebat!","Bagus!","Tepat sekali!","Pandai!"]); $("fbMsg").className="fb-msg ok"; }
    else{ btns[i].classList.add("wrong"); $("fbMsg").textContent="Jawapan betul: "+q.ans; $("fbMsg").className="fb-msg no"; }
    beep(o.ok);
    var a=$("qBody").querySelector(".ans"); if(a) a.textContent=q.ans;
    $("barFill").style.width=(qn/TOTAL*100)+"%";
    $("nextBtn").textContent=qn>=TOTAL?"Lihat markah →":"Seterusnya →";
    $("nextBtn").classList.add("show"); $("nextBtn").focus();
  }
  function finish(){
    var st=starsFor(score);
    if(st>(best[cur.id]||0)){ best[cur.id]=st; saveBest(); }
    $("rStars").innerHTML=starsHTML(st);
    $("rScore").textContent=score+" / "+TOTAL;
    $("rMsg").textContent= st===3?"Cemerlang! Kamu memang hebat dalam topik "+cur.name+"." : st===2?"Bagus! Sikit lagi untuk dapat 3 bintang." : st===1?"Boleh tahan. Cuba sekali lagi, mesti lebih baik!" : "Tak apa, semua orang belajar. Jom cuba lagi!";
    show("result");
  }
  $("topics").addEventListener("click",function(e){var b=e.target.closest(".topic"); if(b) start(+b.dataset.i);});
  $("opts").addEventListener("click",function(e){var b=e.target.closest(".opt"); if(b&&!b.disabled) answer(+b.dataset.i);});
  $("nextBtn").addEventListener("click",nextQ);
  $("backBtn").addEventListener("click",function(){renderHome(); show("home");});
  $("againBtn").addEventListener("click",function(){start(TOPICS.indexOf(cur));});
  $("homeBtn").addEventListener("click",function(){renderHome(); show("home");});
  renderHome();
  window.__TOPICS=TOPICS;
})();
</script>
<script>
(function(){
  var btn=document.getElementById("musicBtn"), lbl=document.getElementById("musicLbl"), ctx=null, master=null, on=false, timer=null, step=0;
  var CH=[[261.63,329.63,392.00,493.88],[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,329.63],[196.00,246.94,293.66,392.00]];
  var PENTA=[523.25,587.33,659.25,783.99,880.00,1046.5];
  function setup(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0;
    var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800;
    var dl=ctx.createDelay(); dl.delayTime.value=0.45; var fb=ctx.createGain(); fb.gain.value=0.35;
    master.connect(lp); lp.connect(ctx.destination); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(ctx.destination);
  }
  function pad(freq,t,dur){
    [0,-6,6].forEach(function(det){
      var o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=freq/2; o.detune.value=det;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.03,t+2.5); g.gain.setValueAtTime(0.03,t+dur-2.5); g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1);
    });
  }
  function bell(freq,t){
    var o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.05,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+2.3);
  }
  function bar(){
    var t=ctx.currentTime+0.1, ch=CH[step%CH.length]; step++;
    ch.forEach(function(f){pad(f,t,8.6);});
    for(var i=0;i<4;i++){ if(Math.random()<0.7) bell(PENTA[Math.floor(Math.random()*PENTA.length)], t+i*2+Math.random()*0.6); }
  }
  function start(){ if(!ctx) setup(); ctx.resume(); master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0.9,ctx.currentTime,1); bar(); clearInterval(timer); timer=setInterval(bar,8000); }
  function stop(){ clearInterval(timer); if(ctx){ master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0,ctx.currentTime,0.4); } }
  btn.addEventListener("click",function(){
    on=!on; btn.setAttribute("aria-pressed",String(on)); btn.classList.toggle("on",on);
    lbl.textContent=on?"Muzik: hidup":"Muzik tenang";
    try{ if(on) start(); else stop(); }catch(e){}
  });
})();
</script>
